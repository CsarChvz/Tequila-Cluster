spring.application.name=TequilaCluster

# --- Server -----------------------------------------------------------
server.port=${SERVER_PORT:8080}

# --- Database (PostgreSQL) --------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tequila_cluster}
spring.datasource.username=${DB_USERNAME:tequila_admin}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: the DDL script is the source of truth for the schema (see
# src/main/resources/sql/DDL_Tequila_Traceability.sql and compose.yml,
# which applies it on the first container start). Never let Hibernate
# create/alter the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Security / JWT -----------------------------------------------------
security.jwt.secret=${JWT_SECRET:change_me_to_a_long_random_string}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- Process configurable variables (NFR-17, RB-104) ---------------------
process.plant-max-capacity-kg=${PLANT_MAX_CAPACITY_KG:50000}
process.retention-years=${RETENTION_YEARS:5}

# --- Logging (docker compose logs -f app) --------------------------------
# Root stays at INFO (framework/library noise); our own package goes down to
# DEBUG so business-rule tracing (RB-*, FR-*) shows up in `docker compose
# logs app` without drowning in Spring/Hibernate internals. Override per
# environment with LOG_LEVEL_APP if a deployment wants a quieter default.
logging.level.root=INFO
logging.level.org.dev.tequilacluster=${LOG_LEVEL_APP:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
