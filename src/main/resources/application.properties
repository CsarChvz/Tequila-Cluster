spring.application.name=TequilaCluster

# --- Server -----------------------------------------------------------
server.port=${SERVER_PORT:8080}

# --- Database (PostgreSQL) --------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tequila_cluster}
spring.datasource.username=${DB_USERNAME:tequila_admin}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: the DDL script is the source of truth for the schema (see
# src/main/resources/sql/DDL_Tequila_Traceability.sql and compose.yml,
# which applies it on the first container start). Never let Hibernate
# create/alter the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Security / JWT -----------------------------------------------------
security.jwt.secret=${JWT_SECRET:change_me_to_a_long_random_string}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- Process configurable variables (NFR-17, RB-104) ---------------------
process.plant-max-capacity-kg=${PLANT_MAX_CAPACITY_KG:50000}
process.retention-years=${RETENTION_YEARS:5}
